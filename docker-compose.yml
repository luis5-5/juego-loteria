version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: juego
    ports:
      - "3306:3306"
    volumes:
      - ./juego.sql:/docker-entrypoint-initdb.d/juego.sql
